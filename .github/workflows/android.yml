name: APK راننده

# ساخت APK روی سرورهای گیت‌هاب.
#
# چرا: ساختِ محلی به Android SDK نیاز دارد و دانلودش از داخل ایران مسدود
# است. اینجا SDK از پیش نصب است و خروجی را می‌شود مستقیم دانلود کرد —
# روی ویندوز هیچ چیزی لازم نیست نصب شود.

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    name: ساخت APK

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Build debug APK
        working-directory: android
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nobatdehi-driver-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # خروجی بالا از blob.core.windows.net سرو می‌شود که از ایران مسدود
      # است، پس همان فایل روی شاخه‌ی apk هم گذاشته می‌شود — آنجا از راه
      # git و raw.githubusercontent.com در دسترس است.
      #
      # شاخه هر بار از نو ساخته و جایگزین می‌شود تا تاریخچه‌ی مخزن پر از
      # نسخه‌های قدیمی APK نشود.
      - name: Publish APK to the apk branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PUB="$(mktemp -d)"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$PUB/nobatdehi-driver.apk"
          cd "$PUB"
          git init -q -b apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nobatdehi-driver.apk
          git commit -q -m "APK ساخته‌شده از $GITHUB_SHA"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk
